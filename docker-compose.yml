services:
  postgres:
    image: postgres:16-alpine
    container_name: life-trace-db
    environment:
      POSTGRES_USER: lifetrace
      POSTGRES_PASSWORD: lifetrace_dev
      POSTGRES_DB: life_trace_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
